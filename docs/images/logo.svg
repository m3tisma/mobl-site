  <!-- متن برند -->
  <text x="205" y="72" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-weight="bold" font-size="46" fill="#00bfa5">مبل شیراز</text>
  <!-- شعار -->
  <text x="205" y="103" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="15" fill="#6c757d">تعمیرات تخصصی مبل</text>
