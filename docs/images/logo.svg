    <line x1="8" y1="82" x2="172" y2="82" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="82" x2="90" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- پایه‌ها -->
    <rect fill="#00bfa5" x="15" y="102" width="14" height="14" rx="2"/>
    <rect fill="#00bfa5" x="151" y="102" width="14" height="14" rx="2"/>
