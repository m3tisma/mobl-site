    <path fill="#00bfa5" d="M 20 30 Q 20 12 40 12 L 140 12 Q 160 12 160 30 L 160 80 L 20 80 Z"/>
    <!-- دسته چپ -->
    <path fill="#00bfa5" d="M 0 50 Q 0 38 15 38 L 22 38 L 22 100 L 0 100 Z"/>
    <!-- دسته راست -->
    <path fill="#00bfa5" d="M 180 50 Q 180 38 165 38 L 158 38 L 158 100 L 180 100 Z"/>
