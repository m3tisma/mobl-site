name: Auto Add Review
on:
  schedule:
    - cron: '0 0 * * *' # هر روز ساعت ۱۲ شب بیدار میشه تا چک کنه
  workflow_dispatch: # اجازه اجرای دستی

permissions:
  contents: write

jobs:
  update-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Add Review
        run: python add_review.py

      - name: Commit and Push
        run: |
          git config --global user.name 'Auto Reviewer Bot'
          git config --global user.email 'bot@moblshiraz.ir'
          git add data_reviews.json
          git add last_run.json
          # این خط چک میکنه اگه تغییری بود کامیت کنه، اگه نظر جدیدی اضافه نشده بود ارور نده
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-added a new review" && git push)
