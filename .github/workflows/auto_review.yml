name: Auto Add Review
on:
  schedule:
    - cron: '0 0 * * *' # هر روز ساعت ۱۲ شب اجرا میشه
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Add Review and Q&A
        run: python add_review.py

      - name: Commit and Push
        run: |
          git config --global user.name 'Auto Reviewer Bot'
          git config --global user.email 'bot@moblshiraz.ir'
          git add data_reviews.json data_qanda.json
          git commit -m "🤖 Auto-update dates and maybe add new review/Q&A" || exit 0
          git push
